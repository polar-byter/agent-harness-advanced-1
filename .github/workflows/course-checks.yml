name: Проверка курса

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  course:
    runs-on: ubuntu-latest
    steps:
      - name: Получить материалы
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Подготовить Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Установить лёгкие зависимости каркасов
        run: python -m pip install openpyxl==3.1.5 Flask==3.1.3 numpy==2.5.4
      - name: Проверить ссылки, архивы и каркасы
        run: python tools/check_course.py
      - name: Проверить эталонные решения без моделей
        run: cd tools && python check_solutions.py
